name: P0 - code quality
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check TypeScript
        run: bunx tsc --noEmit
      # Repository-wide lint currently fails on pre-existing formatting and any
      # debt. Gate the P0-touched files without changing unrelated modules.
      - name: Lint P0 touched code (legacy debt as warnings)
        run: >-
          bunx eslint --config eslint.p0.config.mjs
          src/components/layout/app-shell.tsx
          src/services/cloud-service.ts
          src/integrations/supabase/types.ts
          tests/p0.integration.test.mjs
      - name: Build
        run: bun run build

# Database tests are intentionally excluded: they require a disposable
# Supabase environment and an explicit opt-in. See docs/P0_SECURITY_ROLLOUT.md.
